#cloud-config
package_update: true
packages:
  - curl
  - wireguard-tools

write_files:
  - path: /opt/start_stack.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      
      curl -fsSL https://get.docker.com | sh
      curl -fsSL https://pkgs.netbird.io/install.sh | sh

      netbird service stop || true
      netbird service start
      
      export HOME=/root
      for i in $(seq 1 10); do
        if netbird up --setup-key ${netbird_setup_key} --wireguard-port 51820; then
          break
        fi
        sleep 3
      done

runcmd:
  - /opt/start_stack.sh