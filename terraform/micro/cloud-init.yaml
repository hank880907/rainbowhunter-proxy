#cloud-config
package_update: true
packages:
  - curl
  - wireguard-tools

write_files:
  - path: /app/docker-compose.yml
    permissions: '0644'
    content: |
      services:
        velocity:
          image: hank880907/rainbowhunter-proxy:${proxy_tag}
          pull_policy: always
          container_name: velocity
          restart: unless-stopped
          ports:
            - "25565:25565"
            - "19132:19132/udp"
            - "25575:25575"
          volumes:
            - /etc/forwarding.secret:/etc/forwarding.secret:ro
          stdin_open: true
          tty: true
          environment:
            JVM_OPTS: "-Xms256M -Xmx400M -XX:+UseSerialGC -XX:MaxInlineLevel=15 -Dfile.encoding=UTF-8"

  - path: /opt/start_stack.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      # Set up 1GB SWAP
      echo "Configuring 1GB Swap file to prevent OOM kills..."
      fallocate -l 1G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
      
      # Install Docker
      curl -fsSL https://get.docker.com | sh
      
      # Install Docker Compose
      curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
      chmod +x /usr/local/bin/docker-compose
      
      # Install Netbird
      curl -fsSL https://pkgs.netbird.io/install.sh | sh

      # Start Netbird
      netbird service stop || true
      netbird service start
      
      export HOME=/root
      for i in $(seq 1 10); do
        if netbird up --setup-key ${netbird_setup_key} --wireguard-port 51820; then
          break
        fi
        sleep 3
      done

      # Fetch forwarding secret from Secret Manager
      gcloud secrets versions access latest --secret="${secret_id}" --project="${project_id}" > /etc/forwarding.secret
      chmod 600 /etc/forwarding.secret

      # Pull latest image and start containers
      cd /app
      docker-compose pull
      docker-compose up -d

      # remove stuff to save memory.
      echo "Purging snapd to free memory..."
      systemctl stop snapd.service snapd.socket snapd.seeded.service || true
      umount /var/lib/snapd/snaps/* 2>/dev/null || true
      apt-get autoremove --purge snapd -y
      rm -rf ~/snap /var/snap /var/lib/snapd /var/cache/snapd
      
      echo "Purging multipath-tools to free memory..."
      systemctl stop multipathd.service multipathd.socket || true
      systemctl disable multipathd.service multipathd.socket || true
      apt-get purge multipath-tools -y

      systemctl stop packagekit rsyslog || true
      apt-get autoremove --purge packagekit rsyslog -y

      systemctl stop networkd-dispatcher || true
      systemctl disable networkd-dispatcher || true

runcmd:
  - /opt/start_stack.sh